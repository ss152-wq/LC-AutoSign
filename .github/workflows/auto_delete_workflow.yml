name: Clean All Workflow Runs Completely
on:
  schedule:
    - cron: '0 0 */3 * *'  # 每3天 UTC 0点（北京时间8点）执行
  workflow_dispatch:       # 手动触发开关

jobs:
  clean-all-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write  # 必须的删除权限
    steps:
      - name: Force delete all old workflow runs
        # 替换为支持 Node.js 24 的新版 Action
        uses: dev-drprasad/delete-older-workflow-runs@v0.3.4
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          keep_minimum_runs: 3    # 0 = 不保留任何记录（彻底清空）
          retain_days: 0          # 0 = 清理所有天数的记录
          # 匹配所有工作流（彻底清理全部记录）
          workflow_pattern: ".*"
