name: Clean All Workflow Runs Completely
on:
  schedule:
    - cron: '0 0 */3 * *'  # 每3天 UTC 0点（北京时间8点）执行
  workflow_dispatch:       # 手动触发开关

jobs:
  clean-all-runs:
    runs-on: ubuntu-latest
    permissions:
      # 必须显式授予所有相关高权限（解决403核心）
      actions: write
      contents: write
      repository-projects: write
    steps:
      - name: Delete all workflow runs (彻底清空)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # 设置 gh 命令行的认证和输出格式
          gh auth setup-git
          gh config set prompt disabled
          
          # 获取仓库所有工作流 ID（排除当前正在运行的清理工作流）
          WORKFLOW_IDS=$(gh api repos/$REPO/actions/workflows --jq '.workflows[] | select(.name != "Clean All Workflow Runs Completely") | .id')
          
          if [ -z "$WORKFLOW_IDS" ]; then
            echo "⚠️  未找到需要清理的工作流"
            exit 0
          fi
          
          # 遍历每个工作流，删除其所有运行记录
          for id in $WORKFLOW_IDS; do
            echo "========================================"
            echo "开始清理工作流 ID: $id 的所有记录..."
            
            # 分页获取该工作流的所有运行记录 ID（避免漏删）
            page=1
            while true; do
              RUN_IDS=$(gh api "repos/$REPO/actions/workflows/$id/runs?page=$page&per_page=100" --jq '.workflow_runs[].id')
              
              if [ -z "$RUN_IDS" ]; then
                break
              fi
              
              # 逐个删除记录（添加错误重试）
              for run_id in $RUN_IDS; do
                echo "删除运行记录 ID: $run_id..."
                # 重试3次，避免临时网络/权限波动
                for attempt in {1..3}; do
                  if gh api --method DELETE "repos/$REPO/actions/runs/$run_id" > /dev/null 2>&1; then
                    echo "✅ 记录 $run_id 删除成功"
                    sleep 0.5  # 降低API调用频率
                    break
                  else
                    echo "⚠️  第 $attempt 次删除记录 $run_id 失败，重试中..."
                    sleep 2
                  fi
                done
              done
              
              page=$((page + 1))
              sleep 1
            done
            
            echo "✅ 工作流 ID: $id 清理完成"
          done
          
          echo "========================================"
          echo "🎉 所有目标工作流记录已清理完成！"
