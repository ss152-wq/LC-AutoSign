name: Clean All Workflow Runs Completely
on:
  schedule:
    - cron: '0 0 */3 * *'  # 每3天 UTC 0点（北京时间8点）执行
  workflow_dispatch:       # 手动触发开关

jobs:
  clean-all-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write  # 必须的删除权限
      contents: read  # gh 命令行需要的基础权限
    steps:
      - name: Install GitHub CLI (确保最新版)
        run: |
          sudo apt update && sudo apt install gh -y
          gh --version

      - name: Delete all workflow runs (彻底清空)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # 获取仓库所有工作流 ID
          WORKFLOW_IDS=$(gh api repos/${{ github.repository }}/actions/workflows --jq '.workflows[].id')
          
          # 遍历每个工作流，删除其所有运行记录
          for id in $WORKFLOW_IDS; do
            echo "开始清理工作流 ID: $id 的所有记录..."
            # 获取该工作流的所有运行记录 ID（按创建时间排序，最新的最后）
            RUN_IDS=$(gh api repos/${{ github.repository }}/actions/workflows/$id/runs --jq '.workflow_runs[].id')
            
            # 删除每条记录
            for run_id in $RUN_IDS; do
              echo "删除运行记录 ID: $run_id..."
              gh api --method DELETE repos/${{ github.repository }}/actions/runs/$run_id
              sleep 1  # 避免 API 频率限制
            done
          done
          
          echo "✅ 所有工作流记录已彻底清理完成！"
