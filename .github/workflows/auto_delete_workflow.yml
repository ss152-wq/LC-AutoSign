name: Clean All Workflow Runs Completely
on:
  schedule:
    - cron: '0 0 */3 * *'  # 每3天 UTC 0点（北京时间8点）执行
  workflow_dispatch:       # 手动触发开关

jobs:
  clean-all-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      repository-projects: write
    steps:
      - name: Delete all workflow runs (彻底清空)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CLEAN_WORKFLOW_NAME: "Clean All Workflow Runs Completely"
        run: |
          # 设置 gh 命令行的认证和输出格式
          gh auth setup-git
          gh config set prompt disabled
          
          # ========== 第一步：清理其他工作流的所有记录 ==========
          echo "📌 开始清理其他工作流的所有记录..."
          OTHER_WORKFLOW_IDS=$(gh api repos/$REPO/actions/workflows --jq --arg name "$CLEAN_WORKFLOW_NAME" '.workflows[] | select(.name != $name) | .id')
          
          if [ -n "$OTHER_WORKFLOW_IDS" ]; then
            for id in $OTHER_WORKFLOW_IDS; do
              echo "----------------------------------------"
              echo "清理工作流 ID: $id 的所有记录..."
              page=1
              while true; do
                RUN_IDS=$(gh api "repos/$REPO/actions/workflows/$id/runs?page=$page&per_page=100" --jq '.workflow_runs[].id')
                if [ -z "$RUN_IDS" ]; then break; fi
                for run_id in $RUN_IDS; do
                  for attempt in {1..3}; do
                    if gh api --method DELETE "repos/$REPO/actions/runs/$run_id" > /dev/null 2>&1; then
                      echo "✅ 记录 $run_id 删除成功"
                      sleep 0.5
                      break
                    else
                      echo "⚠️  第 $attempt 次删除记录 $run_id 失败，重试中..."
                      sleep 2
                    fi
                  done
                done
                page=$((page + 1))
                sleep 1
              done
              echo "✅ 工作流 ID: $id 清理完成"
            done
          else
            echo "⚠️  未找到其他需要清理的工作流"
          fi
          
          # ========== 第二步：清理清理工作流的旧记录（保留最新1条） ==========
          echo -e "\n📌 开始清理清理工作流的旧记录（保留最新1条）..."
          CLEAN_WORKFLOW_ID=$(gh api repos/$REPO/actions/workflows --jq --arg name "$CLEAN_WORKFLOW_NAME" '.workflows[] | select(.name == $name) | .id')
          
          if [ -n "$CLEAN_WORKFLOW_ID" ]; then
            # 获取清理工作流的所有运行记录 ID（按创建时间排序，最新的在最后）
            RUN_IDS=$(gh api "repos/$REPO/actions/workflows/$CLEAN_WORKFLOW_ID/runs?per_page=100" --jq '.workflow_runs[].id' | tac)
            # 跳过第一条（最新的），删除剩下的
            SKIP_FIRST=1
            for run_id in $RUN_IDS; do
              if [ $SKIP_FIRST -eq 1 ]; then
                echo "📌 保留清理工作流最新记录 ID: $run_id"
                SKIP_FIRST=0
                continue
              fi
              echo "删除清理工作流旧记录 ID: $run_id..."
              for attempt in {1..3}; do
                if gh api --method DELETE "repos/$REPO/actions/runs/$run_id" > /dev/null 2>&1; then
                  echo "✅ 旧记录 $run_id 删除成功"
                  sleep 0.5
                  break
                else
                  echo "⚠️  第 $attempt 次删除旧记录 $run_id 失败，重试中..."
                  sleep 2
                fi
              done
            done
          else
            echo "⚠️  未找到清理工作流自身的记录"
          fi
          
          echo -e "\n🎉 所有记录清理完成！"
