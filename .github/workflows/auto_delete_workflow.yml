name: Clean All Workflow Runs Completely
on:
  schedule:
    - cron: '0 0 */3 * *'  # 每3天 UTC 0点（北京时间8点）执行
  workflow_dispatch:       # 手动触发开关

jobs:
  clean-all-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Delete all workflow runs (使用 curl 直接调用 API)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          CLEAN_WORKFLOW_NAME: "Clean All Workflow Runs Completely"
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          # 设置通用请求头
          HEADERS=(
            -H "Authorization: token $GITHUB_TOKEN"
            -H "Accept: application/vnd.github.v3+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          
          # ========== 第一步：获取所有工作流列表 ==========
          echo "📌 获取仓库所有工作流..."
          WORKFLOWS=$(curl -s "${HEADERS[@]}" "https://api.github.com/repos/$OWNER/$REPO/actions/workflows")
          
          # 解析出所有工作流 ID 和名称
          ALL_WORKFLOWS=$(echo "$WORKFLOWS" | jq -r '.workflows[] | "\(.id)|\(.name)"')
          
          if [ -z "$ALL_WORKFLOWS" ]; then
            echo "⚠️  未找到任何工作流"
            exit 0
          fi
          
          # ========== 第二步：遍历所有工作流，删除记录 ==========
          echo -e "\n📌 开始清理所有工作流记录..."
          echo "$ALL_WORKFLOWS" | while IFS='|' read -r WF_ID WF_NAME; do
            echo -e "\n----------------------------------------"
            echo "处理工作流: $WF_NAME (ID: $WF_ID)"
            
            # 分页获取该工作流的所有运行记录
            PAGE=1
            while true; do
              # 获取当前页的运行记录
              RUNS=$(curl -s "${HEADERS[@]}" "https://api.github.com/repos/$OWNER/$REPO/actions/workflows/$WF_ID/runs?page=$PAGE&per_page=100")
              # 解析出运行记录 ID（排除当前正在运行的记录）
              RUN_IDS=$(echo "$RUNS" | jq -r --arg curr "$CURRENT_RUN_ID" '.workflow_runs[] | select(.id != ($curr | tonumber)) | .id')
              
              if [ "$RUN_IDS" = "null" ] || [ -z "$RUN_IDS" ]; then
                echo "✅ 工作流 $WF_NAME 所有记录已清理完毕"
                break
              fi
              
              # 逐个删除运行记录
              echo "$RUN_IDS" | while read -r RUN_ID; do
                if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
                  continue
                fi
                
                echo "删除记录 ID: $RUN_ID..."
                # 重试3次
                for ATTEMPT in {1..3}; do
                  DELETE_RESP=$(curl -s -w "%{http_code}" -X DELETE "${HEADERS[@]}" "https://api.github.com/repos/$OWNER/$REPO/actions/runs/$RUN_ID")
                  HTTP_CODE=$(echo "$DELETE_RESP" | tail -n1)
                  RESP_BODY=$(echo "$DELETE_RESP" | head -n -1)
                  
                  if [ "$HTTP_CODE" = "204" ]; then
                    echo "✅ 记录 $RUN_ID 删除成功"
                    sleep 0.5
                    break
                  elif [ "$HTTP_CODE" = "404" ]; then
                    echo "ℹ️  记录 $RUN_ID 已不存在，跳过"
                    break
                  else
                    echo "⚠️  第 $ATTEMPT 次删除记录 $RUN_ID 失败 (HTTP $HTTP_CODE)，重试中..."
                    sleep 2
                  fi
                done
              done
              
              PAGE=$((PAGE + 1))
              sleep 1
            done
          done
          
          echo -e "\n🎉 所有工作流记录清理完成！"
