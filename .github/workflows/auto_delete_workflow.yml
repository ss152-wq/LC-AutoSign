name: Clean All Workflow Runs Completely
on:
  schedule:
    - cron: '0 0 */3 * *'  # 每3天 UTC 0点（北京时间8点）执行
  workflow_dispatch:       # 手动触发开关

jobs:
  clean-all-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write  # 必须的删除权限
    steps:
      - name: Force delete all old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0                # 0 = 无视天数，清理所有记录
          keep_minimum_runs: 3          # 0 = 不保留任何记录（彻底清空）
          dry_run: false                # 先设为true测试，确认后改false
          delete_run_by_conclusion_pattern: ".*"  # 匹配所有运行状态
          delete_workflow_pattern: ".*"           # 匹配所有工作流名称
