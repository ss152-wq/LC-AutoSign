name: milwaukeetool Auto Sign

# 触发规则：每天1次（降低频率，减少500错误）+ 手动触发
on:
  schedule:
    - cron: '0 2 * * *'  # UTC时间2点 = 北京时间10点，每天仅1次
  workflow_dispatch:  # 手动触发开关

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      # 步骤1：拉取仓库代码（必须，否则无法访问workflows目录下的文件）
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：设置Python环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # 兼容所有Python3版本

      # 步骤3：安装依赖（仅需requests）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 步骤4：执行签到脚本（核心：指定完整路径）
      - name: Run sign script
        env:
          # 从GitHub Secrets注入凭证
          MILWAUKEETOOL_CLIENT_ID: ${{ secrets.MILWAUKEETOOL_CLIENT_ID }}
          MILWAUKEETOOL_TOKEN_LIST: ${{ secrets.MILWAUKEETOOL_TOKEN_LIST }}
          SENDKEY: ${{ secrets.SENDKEY }}  # 可选：推送密钥
        run: |
          # 关键：脚本在.github/workflows/下，需写完整相对路径
          python .github/workflows/milwaukeetool-sign.py
