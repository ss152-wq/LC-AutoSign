name: milwaukeetool Auto Sign

# 触发规则：定时（每6小时）+ 手动触发
on:
  schedule:
    - cron: '0 0,6,12,18 * * *'  # UTC时间，对应北京时间 8,14,20,2点
  workflow_dispatch:  # 手动触发开关

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      # 步骤1：拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：设置Python环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 步骤3：安装依赖（仅需requests）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 步骤4：执行签到脚本（关键：修改脚本路径）
      - name: Run sign script
        env:
          MILWAUKEETOOL_CLIENT_ID: ${{ secrets.MILWAUKEETOOL_CLIENT_ID }}
          MILWAUKEETOOL_TOKEN_LIST: ${{ secrets.MILWAUKEETOOL_TOKEN_LIST }}
          SENDKEY: ${{ secrets.SENDKEY }}
        run: |
          # 脚本放在.github/workflows/目录下，需指定完整路径
          python .github/workflows/milwaukeetool-sign.py
